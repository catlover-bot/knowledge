<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1510" viewBox="0 0 640 1510" role="img" aria-labelledby="title desc" lang="ja">
<title id="title">説明文からCAD の操作列をつくる</title>
<desc id="desc">学習用の注釈づくりは形状画像とCAD履歴からL0からL3の説明を作る別工程。生成時は多段階の説明文から次の操作を予測し、スケッチと押し出しの操作列から形状を構築し、寸法を要求と照合する。穴間隔変更は新しい要求での生成を考える未実施の想定例であり、既存CADの直接編集能力の実証ではない。 独自作成の概念図であり、実測結果を示すものではない。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="context-stroke" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g font-family="Noto Sans CJK JP, Noto Sans JP, Hiragino Kaku Gothic ProN, Meiryo, sans-serif">
<rect x="0" y="0" width="640" height="1510" rx="28" fill="#F4F7FB" stroke="#F4F7FB" stroke-width="0"/>
<rect x="32" y="28" width="6" height="25" rx="3" fill="#087F8C" stroke="#087F8C" stroke-width="0"/>
<text x="52" y="49" font-size="22" fill="#087F8C" font-weight="700">TEXT2CAD · SEQUENCE</text>
<text x="32" y="99" font-size="34" fill="#182C43" font-weight="700">説明文から</text><text x="32" y="142" font-size="34" fill="#182C43" font-weight="700">CAD の操作列をつくる</text><text x="32" y="184" font-size="23" fill="#50647A" font-weight="500">学習用注釈と生成時の流れを分ける</text><rect x="32" y="212" width="576" height="163" rx="20" fill="#F3EFFA" stroke="#D7CDEA" stroke-width="2"/><text x="58" y="255" font-size="27" fill="#7051BC" font-weight="700">学習用の注釈づくり</text><text x="58" y="301" font-size="25" fill="#182C43" font-weight="500">形状画像 ＋ CAD 履歴</text><text x="58" y="345" font-size="25" fill="#7051BC" font-weight="600">→ 説明のレベル L0〜L3</text><text x="32" y="428" font-size="26" fill="#087F8C" font-weight="700">生成時の流れ</text><rect x="32" y="454" width="576" height="126" rx="20" fill="#FFFFFF" stroke="#D4DEE9" stroke-width="2"/><circle cx="76" cy="497" r="22" fill="#087F8C"/><text x="76" y="506" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><text x="114" y="507" font-size="29" fill="#182C43" font-weight="700">多段階の説明文</text><text x="58" y="554" font-size="25" fill="#50647A" font-weight="500">形状・寸法・構成を言語化</text><rect x="32" y="630" width="576" height="126" rx="20" fill="#FFFFFF" stroke="#D4DEE9" stroke-width="2"/><circle cx="76" cy="673" r="22" fill="#087F8C"/><text x="76" y="682" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><text x="114" y="683" font-size="29" fill="#182C43" font-weight="700">次の操作を予測</text><text x="58" y="730" font-size="25" fill="#50647A" font-weight="500">それまでの操作列を参照</text><rect x="32" y="806" width="576" height="126" rx="20" fill="#FFFFFF" stroke="#D4DEE9" stroke-width="2"/><circle cx="76" cy="849" r="22" fill="#087F8C"/><text x="76" y="858" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><text x="114" y="859" font-size="29" fill="#182C43" font-weight="700">スケッチ＋押し出し</text><text x="58" y="906" font-size="25" fill="#50647A" font-weight="500">操作列から形状を構築</text><rect x="32" y="982" width="576" height="126" rx="20" fill="#FFFFFF" stroke="#D4DEE9" stroke-width="2"/><circle cx="76" cy="1025" r="22" fill="#087F8C"/><text x="76" y="1034" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text><text x="114" y="1035" font-size="29" fill="#182C43" font-weight="700">寸法を再確認</text><text x="58" y="1082" font-size="25" fill="#50647A" font-weight="500">出力形状を要求と照合</text><path d="M320 585 L320 616" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M320 761 L320 792" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M320 937 L320 968" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="32" y="1140" width="576" height="173" rx="20" fill="#EEF4F7" stroke="#D4DEE9" stroke-width="2"/><text x="58" y="1180" font-size="26" fill="#285EC8" font-weight="700">説明用の想定例</text><text x="58" y="1222" font-size="24" fill="#182C43" font-weight="500">穴間隔 30 → 40 mm を新しく要求</text><text x="58" y="1261" font-size="23" fill="#50647A" font-weight="500">既存 CAD の直接編集能力を</text><text x="58" y="1295" font-size="23" fill="#50647A" font-weight="500">実証する例ではない</text><rect x="32" y="1341" width="576" height="64" rx="16" fill="#FFF7E9" stroke="#EBD6B3" stroke-width="2"/><rect x="32" y="1341" width="7" height="64" rx="3" fill="#9B580D" stroke="#9B580D" stroke-width="0"/><text x="56" y="1375" font-size="24" fill="#9B580D" font-weight="600">生成可能 ≠ 意図・製造の保証</text><path d="M32 1426 L608 1426" fill="none" stroke="#D4DEE9" stroke-width="2"/><text x="32" y="1462" font-size="22" fill="#50647A" font-weight="500">独自概念図 · 実測結果ではない</text>
</g>
</svg>
