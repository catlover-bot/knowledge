<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1840" viewBox="0 0 640 1840" role="img" aria-labelledby="title desc" lang="ja">
<title id="title">似た名前の評価でも条件と指標は別もの</title>
<desc id="desc">クリーンなデータによる学習後、固定推論とテスト時適応を区別して記録する。RenらのModelNet-Cは7種類×5強度。各劣化で5強度の誤り率の合計を同条件の基準DGCNNの合計で割ったCEを求め、7種類を平均してmCEを得る。SunらのModelNet40-Cは13種類×5強度と、OcclusionおよびLiDARの2種類×5視点。種類ごとに5条件を平均し、さらに15種類を平均して未正規化のERcorを得る。2種類の視点条件は強度順ではない。点配置は独自の架空の例。 独自作成の概念図であり、実測結果を示すものではない。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="context-stroke" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g font-family="Noto Sans CJK JP, Noto Sans JP, Hiragino Kaku Gothic ProN, Meiryo, sans-serif">
<rect x="0" y="0" width="640" height="1840" rx="28" fill="#F4F7FB" stroke="#F4F7FB" stroke-width="0"/>
<rect x="32" y="28" width="6" height="25" rx="3" fill="#087F8C" stroke="#087F8C" stroke-width="0"/>
<text id="label-106" x="52" y="49" font-size="22" fill="#087F8C" font-weight="700">POINT CLOUDS · CORRUPTION TESTS</text>
<text id="label-107" x="32" y="99" font-size="34" fill="#182C43" font-weight="700">似た名前の評価でも</text><text id="label-108" x="32" y="142" font-size="34" fill="#182C43" font-weight="700">条件と指標は別もの</text><text id="label-109" x="32" y="184" font-size="23" fill="#50647A" font-weight="500">分類用の2ベンチマークを読み分ける</text><rect x="32" y="212" width="576" height="130" rx="20" fill="#182C43" stroke="#182C43" stroke-width="2"/><text id="label-69" x="320" y="259" font-size="29" fill="#FFFFFF" font-weight="700" text-anchor="middle">クリーンなデータで学習</text><text id="label-70" x="320" y="306" font-size="25" fill="#FFFFFF" font-weight="500" text-anchor="middle">通常の拡張条件も記録</text><path d="M320 342 V366 H170 V389" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M320 366 H470 V389" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="32" y="403" width="276" height="167" rx="20" fill="#EBF5F5" stroke="#BAD8DB" stroke-width="2"/><text id="label-71" x="170" y="448" font-size="29" fill="#087F8C" font-weight="700" text-anchor="middle">固定推論</text><text id="label-72" x="170" y="499" font-size="24" fill="#182C43" font-weight="500" text-anchor="middle">モデルを更新せず</text><text id="label-73" x="170" y="535" font-size="24" fill="#182C43" font-weight="500" text-anchor="middle">推論する</text><rect x="332" y="403" width="276" height="167" rx="20" fill="#F3EFFA" stroke="#D7CDEA" stroke-width="2"/><text id="label-74" x="470" y="448" font-size="27" fill="#7051BC" font-weight="700" text-anchor="middle">テスト時適応</text><text id="label-75" x="470" y="491" font-size="22" fill="#182C43" font-weight="500" text-anchor="middle">Sunら：BN / TENT</text><text id="label-76" x="470" y="532" font-size="22" fill="#182C43" font-weight="500" text-anchor="middle">統計・一部重みを更新</text><path d="M170 576 V593 H320 V614" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M470 576 V593 H320" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text id="label-77" x="320" y="649" font-size="25" fill="#182C43" font-weight="700" text-anchor="middle">方式ごとに、別々に評価・集計</text><rect x="32" y="685" width="276" height="860" rx="20" fill="#FFFFFF" stroke="#D4DEE9" stroke-width="2"/><rect x="32" y="685" width="276" height="104" rx="20" fill="#EBF5F5" stroke="#BAD8DB" stroke-width="2"/><path d="M52 790 L288 790" fill="none" stroke="#D4DEE9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="332" y="685" width="276" height="860" rx="20" fill="#FFFFFF" stroke="#D4DEE9" stroke-width="2"/><rect x="332" y="685" width="276" height="104" rx="20" fill="#EEF1FB" stroke="#C6D0EC" stroke-width="2"/><path d="M352 790 L588 790" fill="none" stroke="#D4DEE9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text id="label-78" x="170" y="729" font-size="29" fill="#087F8C" font-weight="700" text-anchor="middle">ModelNet-C</text><text id="label-79" x="170" y="764" font-size="22" fill="#50647A" font-weight="500" text-anchor="middle">Renら / ICML 2022</text><text id="label-80" x="470" y="729" font-size="27" fill="#285EC8" font-weight="700" text-anchor="middle">ModelNet40-C</text><text id="label-81" x="470" y="764" font-size="22" fill="#50647A" font-weight="500" text-anchor="middle">Sunら / 2022</text><text id="label-82" x="170" y="840" font-size="31" fill="#087F8C" font-weight="700" text-anchor="middle">7 種類</text><text id="label-83" x="170" y="885" font-size="29" fill="#182C43" font-weight="700" text-anchor="middle">× 5 強度</text><text id="label-84" x="170" y="928" font-size="24" fill="#50647A" font-weight="500" text-anchor="middle">＝ 35 条件</text><text id="label-85" x="470" y="837" font-size="24" fill="#285EC8" font-weight="700" text-anchor="middle">13種類 × 5強度</text><text id="label-86" x="470" y="877" font-size="24" fill="#285EC8" font-weight="700" text-anchor="middle">＋ 2種類 × 5視点</text><text id="label-87" x="470" y="914" font-size="23" fill="#50647A" font-weight="500" text-anchor="middle">Occlusion / LiDAR</text><text id="label-88" x="470" y="950" font-size="24" fill="#50647A" font-weight="500" text-anchor="middle">＝ 75 条件</text><circle cx="103.6" cy="1002.15" r="5" fill="#087F8C"/><circle cx="115.4" cy="1029.7" r="5" fill="#087F8C"/><circle cx="133.7" cy="1052.5" r="5" fill="#087F8C"/><circle cx="134.8" cy="988.85" r="5" fill="#087F8C"/><circle cx="141.4" cy="1014.5" r="5" fill="#087F8C"/><circle cx="151.9" cy="1037.3" r="5" fill="#087F8C"/><circle cx="155.6" cy="1000.25" r="5" fill="#087F8C"/><circle cx="164.8" cy="1060.1" r="5" fill="#087F8C"/><circle cx="174.0" cy="1024.0" r="5" fill="#087F8C"/><circle cx="176.4" cy="1043.95" r="5" fill="#087F8C"/><circle cx="185.6" cy="986.0" r="5" fill="#087F8C"/><circle cx="200.0" cy="1012.6" r="5" fill="#087F8C"/><circle cx="201.1" cy="1059.15" r="5" fill="#087F8C"/><circle cx="207.7" cy="1031.6" r="5" fill="#087F8C"/><circle cx="224.7" cy="999.3" r="5" fill="#087F8C"/><circle cx="227.1" cy="1024.95" r="5" fill="#087F8C"/><circle cx="233.7" cy="1049.65" r="5" fill="#087F8C"/><circle cx="456.6" cy="1000.25" r="5" fill="#285EC8"/><circle cx="461.8" cy="1060.1" r="5" fill="#285EC8"/><circle cx="467.0" cy="1024.0" r="5" fill="#285EC8"/><circle cx="477.4" cy="1043.95" r="5" fill="#285EC8"/><circle cx="482.6" cy="986.0" r="5" fill="#285EC8"/><circle cx="493.0" cy="1012.6" r="5" fill="#285EC8"/><circle cx="502.1" cy="1059.15" r="5" fill="#285EC8"/><circle cx="504.7" cy="1031.6" r="5" fill="#285EC8"/><circle cx="517.7" cy="999.3" r="5" fill="#285EC8"/><circle cx="528.1" cy="1024.95" r="5" fill="#285EC8"/><circle cx="530.7" cy="1049.65" r="5" fill="#285EC8"/><rect x="408" y="972" width="51" height="105" rx="8" fill="#E7EAF0" stroke="#CAD1DD" stroke-width="1"/><text id="label-89" x="170" y="1110" font-size="22" fill="#50647A" font-weight="500" text-anchor="middle">例：座標のゆらぎ</text><text id="label-90" x="470" y="1110" font-size="22" fill="#50647A" font-weight="500" text-anchor="middle">例：一部を遮蔽</text><path d="M170 1128 L170 1150" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M470 1128 L470 1150" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text id="label-91" x="170" y="1192" font-size="22" fill="#182C43" font-weight="500" text-anchor="middle">5強度の誤り率を合計</text><text id="label-92" x="170" y="1228" font-size="22" fill="#182C43" font-weight="500" text-anchor="middle">DGCNNの合計で割る</text><text id="label-93" x="170" y="1269" font-size="25" fill="#087F8C" font-weight="700" text-anchor="middle">→ 劣化別 CE</text><text id="label-94" x="470" y="1192" font-size="23" fill="#182C43" font-weight="500" text-anchor="middle">各種類の誤り率を</text><text id="label-95" x="470" y="1228" font-size="25" fill="#182C43" font-weight="500" text-anchor="middle">5条件で平均</text><text id="label-96" x="470" y="1269" font-size="22" fill="#50647A" font-weight="500" text-anchor="middle">2種類は強度順でない</text><path d="M170 1293 L170 1322" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M470 1293 L470 1322" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text id="label-97" x="170" y="1367" font-size="24" fill="#182C43" font-weight="600" text-anchor="middle">7種類のCEを平均</text><text id="label-98" x="470" y="1367" font-size="25" fill="#182C43" font-weight="600" text-anchor="middle">15種類を平均</text><text id="label-99" x="170" y="1430" font-size="35" fill="#087F8C" font-weight="700" text-anchor="middle">mCE</text><text id="label-100" x="470" y="1430" font-size="35" fill="#285EC8" font-weight="700" text-anchor="middle">ERcor</text><text id="label-101" x="170" y="1482" font-size="23" fill="#50647A" font-weight="500" text-anchor="middle">基準モデル比</text><text id="label-102" x="470" y="1482" font-size="23" fill="#50647A" font-weight="500" text-anchor="middle">未正規化の誤り率</text><rect x="32" y="1578" width="576" height="132" rx="16" fill="#FFF7E9" stroke="#EBD6B3" stroke-width="2"/><rect x="32" y="1578" width="7" height="132" rx="3" fill="#9B580D" stroke="#9B580D" stroke-width="0"/><text id="label-103" x="56" y="1612" font-size="24" fill="#9B580D" font-weight="600">mCE と ERcor は別の量</text><text id="label-104" x="56" y="1646" font-size="24" fill="#9B580D" font-weight="600">固定推論とテスト時適応を混ぜない</text><text id="label-105" x="56" y="1680" font-size="24" fill="#9B580D" font-weight="600">点の配置は模式例。性能差は示さない。</text><path d="M32 1756 L608 1756" fill="none" stroke="#D4DEE9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text id="label-110" x="32" y="1792" font-size="22" fill="#50647A" font-weight="500">独自概念図 · 実測結果ではない</text>
</g>
</svg>
