<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1480" viewBox="0 0 640 1480" role="img" aria-labelledby="title desc" lang="ja">
<title id="title">学習で方策を更新しコンパイル時は固定する</title>
<desc id="desc">学習時はIRの呼出し箇所から得た特徴量に基づき方策がインライン化するか判断し、一連の判断後のLLVM変換結果のサイズを評価する。サイズ報酬で方策を更新する。一方、実利用のコンパイル時は固定した方策で推論し、更新ループを持たない。生成されたプログラムの実行時ではない。 独自作成の概念図であり、実測結果を示すものではない。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="context-stroke" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g font-family="Noto Sans CJK JP, Noto Sans JP, Hiragino Kaku Gothic ProN, Meiryo, sans-serif">
<rect x="0" y="0" width="640" height="1480" rx="28" fill="#F4F7FB" stroke="#F4F7FB" stroke-width="0"/>
<rect x="32" y="28" width="6" height="25" rx="3" fill="#087F8C" stroke="#087F8C" stroke-width="0"/>
<text x="52" y="49" font-size="22" fill="#087F8C" font-weight="700">MLGO · LEARNING &amp; INFERENCE</text>
<text x="32" y="99" font-size="34" fill="#182C43" font-weight="700">学習で方策を更新し</text><text x="32" y="142" font-size="34" fill="#182C43" font-weight="700">コンパイル時は固定する</text><text x="32" y="184" font-size="23" fill="#50647A" font-weight="500">インライン化の判断を学習する例</text><rect x="32" y="212" width="576" height="844" rx="22" fill="#ECF4F6" stroke="#BFD7DC" stroke-width="2"/><text x="56" y="254" font-size="26" fill="#087F8C" font-weight="700">学習：サイズを目的に改善</text><rect x="60" y="280" width="488" height="110" rx="20" fill="#FFFFFF" stroke="#D4DEE9" stroke-width="2"/><circle cx="96" cy="321" r="22" fill="#087F8C"/><text x="96" y="330" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><text x="131" y="331" font-size="27" fill="#182C43" font-weight="700">IR の呼出し箇所</text><text x="82" y="372" font-size="24" fill="#50647A" font-weight="500">判断に使う特徴を取り出す</text><rect x="60" y="442" width="488" height="120" rx="20" fill="#FFFFFF" stroke="#D4DEE9" stroke-width="2"/><circle cx="96" cy="483" r="22" fill="#087F8C"/><text x="96" y="492" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><text x="131" y="493" font-size="27" fill="#182C43" font-weight="700">特徴量 → 方策</text><text x="82" y="534" font-size="24" fill="#50647A" font-weight="500">学習中の方策で判断する</text><rect x="60" y="614" width="488" height="120" rx="20" fill="#FFFFFF" stroke="#D4DEE9" stroke-width="2"/><circle cx="96" cy="655" r="22" fill="#087F8C"/><text x="96" y="664" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><text x="131" y="665" font-size="27" fill="#182C43" font-weight="700">展開する／しない</text><text x="82" y="706" font-size="24" fill="#50647A" font-weight="500">一連の呼出し箇所で判断</text><rect x="60" y="786" width="488" height="156" rx="20" fill="#FFFFFF" stroke="#D4DEE9" stroke-width="2"/><circle cx="96" cy="827" r="22" fill="#087F8C"/><text x="96" y="836" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text><text x="131" y="837" font-size="27" fill="#182C43" font-weight="700">LLVM 変換・サイズ評価</text><text x="82" y="878" font-size="24" fill="#50647A" font-weight="500">一連の判断後のコードを評価</text><path d="M304 395 L304 427" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M304 567 L304 599" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M304 739 L304 771" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M548 869 H582 V502 H558" fill="none" stroke="#7051BC" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="582" cy="687" r="17" fill="#ECF4F6" stroke="#7051BC" stroke-width="3"/><text x="72" y="1008" font-size="26" fill="#7051BC" font-weight="700">サイズ報酬で ② の方策を更新</text><rect x="32" y="1082" width="576" height="279" rx="22" fill="#FFFFFF" stroke="#D4DEE9" stroke-width="2"/><text x="56" y="1130" font-size="27" fill="#285EC8" font-weight="700">実利用：コンパイル時の推論</text><rect x="56" y="1174" width="138" height="92" rx="14" fill="#EEF1FB" stroke="#CCD5EC" stroke-width="2"/><text x="125.0" y="1230" font-size="24" fill="#285EC8" font-weight="700" text-anchor="middle">特徴量</text><rect x="226" y="1174" width="184" height="92" rx="14" fill="#EEF1FB" stroke="#CCD5EC" stroke-width="2"/><text x="318.0" y="1230" font-size="24" fill="#285EC8" font-weight="700" text-anchor="middle">固定方策</text><rect x="444" y="1174" width="140" height="92" rx="14" fill="#EEF1FB" stroke="#CCD5EC" stroke-width="2"/><text x="514.0" y="1230" font-size="24" fill="#285EC8" font-weight="700" text-anchor="middle">LLVM変換</text><path d="M196 1220 L218 1220" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M412 1220 L436 1220" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="56" y="1318" font-size="25" fill="#50647A" font-weight="500">固定方策で推論し、更新はしない</text><path d="M32 1396 L608 1396" fill="none" stroke="#D4DEE9" stroke-width="2"/><text x="32" y="1432" font-size="22" fill="#50647A" font-weight="500">独自概念図 · 実測結果ではない</text>
</g>
</svg>
