<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1800" viewBox="0 0 640 1800" role="img" aria-labelledby="title desc" lang="ja">
<title id="title">近くの形を集め広い形へつなぐ</title>
<desc id="desc">密な部分と疎な部分を含む仮の点群から、FPSで中心を選び、固定半径のball queryで近傍を作る。中心を引いた相対座標と点特徴に共有MLPを適用し、近傍内maxで局所特徴を作る。代表点座標と局所特徴を次段へ渡し、広い範囲を扱う。MSGは同じ段の同じ中心で複数半径の特徴を抽出して連結する。MRGの経路と特徴を元の点へ戻す処理は省略。円は球近傍の二次元模式図で、点位置や縮尺は任意。 独自作成の概念図であり、実測結果を示すものではない。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="context-stroke" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g font-family="Noto Sans CJK JP, Noto Sans JP, Hiragino Kaku Gothic ProN, Meiryo, sans-serif">
<rect x="0" y="0" width="640" height="1800" rx="28" fill="#F4F7FB" stroke="#F4F7FB" stroke-width="0"/>
<rect x="32" y="28" width="6" height="25" rx="3" fill="#087F8C" stroke="#087F8C" stroke-width="0"/>
<text id="label-64" x="52" y="49" font-size="22" fill="#087F8C" font-weight="700">POINTNET++ · HIERARCHY</text>
