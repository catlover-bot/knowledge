"#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="32" y="504" width="576" height="313" rx="20" fill="#FFFFFF" stroke="#D4DEE9" stroke-width="2"/><circle cx="74" cy="547" r="22" fill="#087F8C"/><text id="label-43" x="74" y="556" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><text id="label-44" x="110" y="557" font-size="28" fill="#182C43" font-weight="700">中心と球近傍を選ぶ</text><text id="label-45" x="58" y="603" font-size="24" fill="#50647A" font-weight="500">FPSで既存点を選択 → 固定半径の球近傍</text><circle cx="181" cy="700" r="62" fill="#EBF5F5" stroke="#087F8C" stroke-width="2"/><circle cx="133" cy="677" r="5" fill="#087F8C"/><circle cx="139" cy="706" r="5" fill="#087F8C"/><circle cx="150" cy="730" r="5" fill="#087F8C"/><circle cx="157" cy="663" r="5" fill="#087F8C"/><circle cx="159" cy="690" r="5" fill="#087F8C"/><circle cx="164" cy="714" r="5" fill="#087F8C"/><circle cx="173" cy="675" r="5" fill="#087F8C"/><circle cx="177" cy="738" r="5" fill="#087F8C"/><circle cx="181" cy="700" r="5" fill="#087F8C"/><circle cx="189" cy="721" r="5" fill="#087F8C"/><circle cx="193" cy="660" r="5" fill="#087F8C"/><circle cx="201" cy="688" r="5" fill="#087F8C"/><circle cx="208" cy="737" r="5" fill="#087F8C"/><circle cx="210" cy="708" r="5" fill="#087F8C"/><circle cx="220" cy="674" r="5" fill="#087F8C"/><circle cx="228" cy="701" r="5" fill="#087F8C"/><circle cx="230" cy="727" r="5" fill="#087F8C"/><circle cx="181" cy="700" r="9" fill="#9B580D" stroke="#FFFFFF" stroke-width="2"/><path d="M193 700 L238 700" fill="none" stroke="#9B580D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text id="label-46" x="209" y="692" font-size="23" fill="#9B580D" font-weight="700">r</text><circle cx="459" cy="700" r="62" fill="#EEF1FB" stroke="#285EC8" stroke-width="2"/><circle cx="417" cy="683" r="5" fill="#285EC8"/><circle cx="434" cy="729" r="5" fill="#285EC8"/><circle cx="459" cy="700" r="5" fill="#285EC8"/><circle cx="477" cy="669" r="5" fill="#285EC8"/><circle cx="497" cy="719" r="5" fill="#285EC8"/><circle cx="459" cy="700" r="9" fill="#9B580D" stroke="#FFFFFF" stroke-width="2"/><path d="M471 700 L516 700" fill="none" stroke="#9B580D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text id="label-47" x="487" y="692" font-size="23" fill="#9B580D" font-weight="700">r</text><text id="label-48" x="320" y="791" font-size="25" fill="#182C43" font-weight="600" text-anchor="middle">同じ半径でも、点数は異なる</text><path d="M320 824 L320 856" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="32" y="869" width="576" height="250" rx="20" fill="#FFFFFF" stroke="#D4DEE9" stroke-width="2"/><circle cx="74" cy="912" r="22" fill="#087F8C"/><text id="label-49" x="74" y="921" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><text id="label-50" x="110" y="922" font-size="28" fill="#182C43" font-weight="700">近傍から局所特徴を作る</text><text id="label-51" x="58" y="970" font-size="25" fill="#50647A" font-weight="500">中心を引いた相対座標＋点特徴</text><rect x="55" y="1004" width="166" height="77" rx="14" fill="#EEF1FB" stroke="#C6D0EC" stroke-width="2"/><text id="label-52" x="138.0" y="1053" font-size="25" fill="#285EC8" font-weight="700" text-anchor="middle">共有MLP</text><rect x="248" y="1004" width="158" height="77" rx="14" fill="#EEF1FB" stroke="#C6D0EC" stroke-width="2"/><text id="label-53" x="327.0" y="1053" font-size="25" fill="#285EC8" font-weight="700" text-anchor="middle">近傍max</text><rect x="434" y="1004" width="151" height="77" rx="14" fill="#EEF1FB" stroke="#C6D0EC" stroke-width="2"/><text id="label-54" x="509.5" y="1053" font-size="25" fill="#285EC8" font-weight="700" text-anchor="middle">局所特徴</text><path d="M226 1043 L239 1043" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M411 1043 L425 1043" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M320 1126 L320 1158" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="32" y="1171" width="576" height="248" rx="20" fill="#FFFFFF" stroke="#D4DEE9" stroke-width="2"/><circle cx="74" cy="1214" r="22" fill="#087F8C"/><text id="label-55" x="74" y="1223" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text><text id="label-56" x="110" y="1224" font-size="28" fill="#182C43" font-weight="700">繰り返して広い文脈へ</text><circle cx="157" cy="1321" r="64" fill="#F3EFFA" stroke="#7051BC" stroke-width="2"/><circle cx="125" cy="1304" r="19" fill="#FFFFFF" stroke="#7051BC" stroke-width="2"/><circle cx="125" cy="1304" r="5" fill="#7051BC"/><circle cx="156" cy="1350" r="19" fill="#FFFFFF" stroke="#7051BC" stroke-width="2"/><circle cx="156" cy="1350" r="5" fill="#7051BC"/><circle cx="188" cy="1307" r="19" fill="#FFFFFF" stroke="#7051BC" stroke-width="2"/><circle cx="188" cy="1307" r="5" fill="#7051BC"/><text id="label-57" x="259" y="1290" font-size="25" fill="#182C43" font-weight="500">代表点の座標と</text><text id="label-58" x="259" y="1328" font-size="25" fill="#182C43" font-weight="500">局所特徴を次の段へ</text><text id="label-59" x="259" y="1378" font-size="24" fill="#50647A" font-weight="500">上位で範囲が広がる</text><rect x="32" y="1451" width="576" height="233" rx="20" fill="#FFFFFF" stroke="#D4DEE9" stroke-width="2"/><text id="label-60" x="58" y="1498" font-size="28" fill="#7051BC" font-weight="700">MSG：同じ中心で複数半径</text><circle cx="124" cy="1582" r="52" fill="none" stroke="#7051BC" stroke-width="2"/><circle cx="124" cy="1582" r="33" fill="none" stroke="#7051BC" stroke-width="2"/><circle cx="124" cy="1582" r="14" fill="none" stroke="#7051BC" stroke-width="2"/><circle cx="124" cy="1582" r="5" fill="#9B580D"/><text id="label-61" x="215" y="1555" font-size="25" fill="#182C43" font-weight="500">同じ段で別々に特徴抽