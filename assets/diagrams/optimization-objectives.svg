<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1210" viewBox="0 0 640 1210" role="img" aria-labelledby="title desc" lang="ja">
<title id="title">変える場所と測る目的を分ける</title>
<desc id="desc">何を変えるかをソースコードの書き換えとコンパイラのパス選択に分岐し、正しさを確認したうえで速度とサイズを独立に測る。速度とサイズの相関を示す図ではない。 独自作成の概念図であり、実測結果を示すものではない。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="context-stroke" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g font-family="Noto Sans CJK JP, Noto Sans JP, Hiragino Kaku Gothic ProN, Meiryo, sans-serif">
<rect x="0" y="0" width="640" height="1210" rx="28" fill="#F4F7FB" stroke="#F4F7FB" stroke-width="0"/>
<rect x="32" y="28" width="6" height="25" rx="3" fill="#087F8C" stroke="#087F8C" stroke-width="0"/>
<text x="52" y="49" font-size="22" fill="#087F8C" font-weight="700">CODE OPTIMIZATION</text>
<text x="32" y="99" font-size="34" fill="#182C43" font-weight="700">変える場所と</text><text x="32" y="142" font-size="34" fill="#182C43" font-weight="700">測る目的を分ける</text><text x="32" y="184" font-size="23" fill="#50647A" font-weight="500">同じ入力・環境・探索予算で比べる</text><rect x="186" y="212" width="268" height="64" rx="18" fill="#182C43" stroke="#182C43" stroke-width="2"/><text x="320" y="255" font-size="28" fill="#FFFFFF" font-weight="700" text-anchor="middle">何を変える？</text><path d="M320 276 V302 H170 V327" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M320 302 H470 V327" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="32" y="339" width="276" height="180" rx="20" fill="#EBF5F5" stroke="#BAD8DB" stroke-width="2"/><text x="170" y="383" font-size="28" fill="#087F8C" font-weight="700" text-anchor="middle">ソースコード</text><text x="170" y="429" font-size="25" fill="#182C43" font-weight="500" text-anchor="middle">処理・構造を</text><text x="170" y="465" font-size="25" fill="#182C43" font-weight="500" text-anchor="middle">書き換える</text><rect x="332" y="339" width="276" height="180" rx="20" fill="#EEF1FB" stroke="#C6D0EC" stroke-width="2"/><text x="470" y="383" font-size="28" fill="#285EC8" font-weight="700" text-anchor="middle">コンパイラ</text><text x="470" y="429" font-size="25" fill="#182C43" font-weight="500" text-anchor="middle">パスを選び</text><text x="470" y="465" font-size="25" fill="#182C43" font-weight="500" text-anchor="middle">変換を任せる</text><path d="M170 519 V552 H320 V580" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M470 519 V552 H320" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="32" y="592" width="576" height="137" rx="20" fill="#FFFFFF" stroke="#D4DEE9" stroke-width="2"/><circle cx="75" cy="637" r="22" fill="#087F8C"/><text x="75" y="646" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">✓</text><text x="113" y="647" font-size="29" fill="#182C43" font-weight="700">正しさを先に確認</text><text x="58" y="694" font-size="25" fill="#50647A" font-weight="500">入力範囲・出力・許容誤差を固定</text><path d="M320 729 V770 H170 V798" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M320 770 H470 V798" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="32" y="810" width="276" height="152" rx="20" fill="#FFFFFF" stroke="#D4DEE9" stroke-width="2"/><text x="170" y="853" font-size="30" fill="#087F8C" font-weight="700" text-anchor="middle">速度</text><text x="170" y="899" font-size="25" fill="#182C43" font-weight="500" text-anchor="middle">実行時間</text><text x="170" y="934" font-size="23" fill="#50647A" font-weight="500" text-anchor="middle">反復とばらつき</text><rect x="332" y="810" width="276" height="152" rx="20" fill="#FFFFFF" stroke="#D4DEE9" stroke-width="2"/><text x="470" y="853" font-size="30" fill="#7051BC" font-weight="700" text-anchor="middle">サイズ</text><text x="470" y="899" font-size="25" fill="#182C43" font-weight="500" text-anchor="middle">容量・命令数</text><text x="470" y="934" font-size="23" fill="#50647A" font-weight="500" text-anchor="middle">測る対象を明示</text><rect x="32" y="990" width="576" height="98" rx="16" fill="#FFF7E9" stroke="#EBD6B3" stroke-width="2"/><rect x="32" y="990" width="7" height="98" rx="3" fill="#9B580D" stroke="#9B580D" stroke-width="0"/><text x="56" y="1024" font-size="24" fill="#9B580D" font-weight="600">速度とサイズは別々に測る</text><text x="56" y="1058" font-size="24" fill="#9B580D" font-weight="600">一方の改善は他方を保証しない</text><path d="M32 1126 L608 1126" fill="none" stroke="#D4DEE9" stroke-width="2"/><text x="32" y="1162" font-size="22" fill="#50647A" font-weight="500">独自概念図 · 実測結果ではない</text>
</g>
</svg>
