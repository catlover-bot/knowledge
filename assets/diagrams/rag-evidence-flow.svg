<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1515" viewBox="0 0 640 1515" role="img" aria-labelledby="title desc" lang="ja">
<title id="title">検索した段落を回答の手がかりにする</title>
<desc id="desc">質問からWikipedia索引内の関連段落AとBを検索する。質問と各段落を別々に条件として生成分布を得て、文全体またはトークンごとに確率を統合する。段落を連結する図ではなく、RAG-Tokenでも同じ検索候補を使う。 独自作成の概念図であり、実測結果を示すものではない。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="context-stroke" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g font-family="Noto Sans CJK JP, Noto Sans JP, Hiragino Kaku Gothic ProN, Meiryo, sans-serif">
<rect x="0" y="0" width="640" height="1515" rx="28" fill="#F4F7FB" stroke="#F4F7FB" stroke-width="0"/>
<rect x="32" y="28" width="6" height="25" rx="3" fill="#087F8C" stroke="#087F8C" stroke-width="0"/>
<text x="52" y="49" font-size="22" fill="#087F8C" font-weight="700">RAG · EVIDENCE FLOW</text>
<text x="32" y="99" font-size="34" fill="#182C43" font-weight="700">検索した段落を</text><text x="32" y="142" font-size="34" fill="#182C43" font-weight="700">回答の手がかりにする</text><text x="32" y="184" font-size="23" fill="#50647A" font-weight="500">段落ごとの生成分布を確率的に統合</text><rect x="32" y="212" width="576" height="104" rx="20" fill="#182C43" stroke="#182C43" stroke-width="2"/><circle cx="75" cy="263" r="22" fill="#087F8C"/><text x="75" y="272" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><text x="115" y="274" font-size="30" fill="#FFFFFF" font-weight="700">質問</text><path d="M320 321 L320 350" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="32" y="364" width="576" height="130" rx="20" fill="#FFFFFF" stroke="#D4DEE9" stroke-width="2"/><circle cx="75" cy="409" r="22" fill="#087F8C"/><text x="75" y="418" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><text x="115" y="420" font-size="29" fill="#182C43" font-weight="700">関連段落を検索</text><text x="58" y="463" font-size="25" fill="#50647A" font-weight="500">Wikipedia 索引から候補を得る</text><path d="M320 494 V519 H171 V541" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M320 519 H469 V541" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="32" y="554" width="276" height="139" rx="20" fill="#FFFFFF" stroke="#D4DEE9" stroke-width="2"/><text x="170" y="599" font-size="28" fill="#087F8C" font-weight="700" text-anchor="middle">候補 A</text><text x="170" y="650" font-size="25" fill="#50647A" font-weight="500" text-anchor="middle">関連段落</text><rect x="332" y="554" width="276" height="139" rx="20" fill="#FFFFFF" stroke="#D4DEE9" stroke-width="2"/><text x="470" y="599" font-size="28" fill="#285EC8" font-weight="700" text-anchor="middle">候補 B</text><text x="470" y="650" font-size="25" fill="#50647A" font-weight="500" text-anchor="middle">関連段落</text><path d="M170 696 L170 738" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M470 696 L470 738" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="32" y="750" width="276" height="181" rx="20" fill="#EBF4F7" stroke="#D4DEE9" stroke-width="2"/><circle cx="63" cy="784" r="22" fill="#087F8C"/><text x="63" y="793" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><text x="94" y="794" font-size="25" fill="#182C43" font-weight="700">段落別に生成</text><text x="170" y="837" font-size="25" fill="#182C43" font-weight="600" text-anchor="middle">質問＋候補 A</text><text x="170" y="888" font-size="26" fill="#087F8C" font-weight="700" text-anchor="middle">生成分布 A</text><rect x="332" y="750" width="276" height="181" rx="20" fill="#EEF1FB" stroke="#D4DEE9" stroke-width="2"/><circle cx="363" cy="784" r="22" fill="#285EC8"/><text x="363" y="793" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><text x="394" y="794" font-size="25" fill="#182C43" font-weight="700">段落別に生成</text><text x="470" y="837" font-size="25" fill="#182C43" font-weight="600" text-anchor="middle">質問＋候補 B</text><text x="470" y="888" font-size="26" fill="#285EC8" font-weight="700" text-anchor="middle">生成分布 B</text><path d="M170 931 V961 H320 V986" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M470 931 V961 H320" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="32" y="998" width="576" height="172" rx="20" fill="#FFFFFF" stroke="#D4DEE9" stroke-width="2"/><circle cx="75" cy="1043" r="22" fill="#7051BC"/><text x="75" y="1052" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text><text x="115" y="1054" font-size="27" fill="#182C43" font-weight="700">重み付けして確率を統合</text><text x="58" y="1105" font-size="25" fill="#50647A" font-weight="500">Sequence：文全体</text><text x="58" y="1142" font-size="25" fill="#50647A" font-weight="500">Token：各トークン</text><path d="M320 1173 L320 1201" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="154" y="1213" width="332" height="66" rx="18" fill="#182C43" stroke="#182C43" stroke-width="2"/><text x="320" y="1257" font-size="28" fill="#FFFFFF" font-weight="700" text-anchor="middle">回答</text><rect x="32" y="1309" width="576" height="98" rx="16" fill="#FFF7E9" stroke="#EBD6B3" stroke-width="2"/><rect x="32" y="1309" width="7" height="98" rx="3" fill="#9B580D" stroke="#9B580D" stroke-width="0"/><text x="56" y="1343" font-size="24" fill="#9B580D" font-weight="600">Token でも検索候補は同じ</text><text x="56" y="1377" font-size="24" fill="#9B580D" font-weight="600">根拠の正しさは別に確認する</text><path d="M32 1431 L608 1431" fill="none" stroke="#D4DEE9" stroke-width="2"/><text x="32" y="1467" font-size="22" fill="#50647A" font-weight="500">独自概念図 · 実測結果ではない</text>
</g>
</svg>
