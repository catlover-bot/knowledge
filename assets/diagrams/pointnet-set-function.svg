<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1580" viewBox="0 0 640 1580" role="img" aria-labelledby="title desc" lang="ja">
<title id="title">点を並べ替えても全体の特徴は変わらない</title>
<desc id="desc">同じ点A、B、CをABCとCABの順に並べる。共有MLPの仮の出力A=(1,4)、B=(3,2)、C=(2,1)をチャネル別にmax集約すると、どちらも(3,4)になる。分類は1つの出力が変わらず、分割では各点に対応する仮のラベルα、β、γもγ、α、βへ並び替わる。T-Netなどは省略した。 独自作成の概念図であり、実測結果を示すものではない。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="context-stroke" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g font-family="Noto Sans CJK JP, Noto Sans JP, Hiragino Kaku Gothic ProN, Meiryo, sans-serif">
<rect x="0" y="0" width="640" height="1580" rx="28" fill="#F4F7FB" stroke="#F4F7FB" stroke-width="0"/>
<rect x="32" y="28" width="6" height="25" rx="3" fill="#087F8C" stroke="#087F8C" stroke-width="0"/>
<text id="label-34" x="52" y="49" font-size="22" fill="#087F8C" font-weight="700">POINTNET · SET FUNCTION</text>
<text id="label-35" x="32" y="99" font-size="34" fill="#182C43" font-weight="700">点を並べ替えても</text><text id="label-36" x="32" y="142" font-size="34" fill="#182C43" font-weight="700">全体の特徴は変わらない</text><text id="label-37" x="32" y="184" font-size="23" fill="#50647A" font-weight="500">共有処理と、順序に依存しない集約</text><rect x="32" y="212" width="576" height="242" rx="20" fill="#FFFFFF" stroke="#D4DEE9" stroke-width="2"/><text id="label-1" x="58" y="257" font-size="27" fill="#182C43" font-weight="700">同じ3点を、異なる順序で入力</text><text id="label-2" x="58" y="329" font-size="25" fill="#50647A" font-weight="500">順序 1</text><circle cx="246" cy="320" r="27" fill="#087F8C"/><text id="label-3" x="246" y="330" font-size="28" fill="#FFFFFF" font-weight="700" text-anchor="middle">A</text><circle cx="386" cy="320" r="27" fill="#285EC8"/><text id="label-4" x="386" y="330" font-size="28" fill="#FFFFFF" font-weight="700" text-anchor="middle">B</text><circle cx="526" cy="320" r="27" fill="#7051BC"/><text id="label-5" x="526" y="330" font-size="28" fill="#FFFFFF" font-weight="700" text-anchor="middle">C</text><text id="label-6" x="58" y="419" font-size="25" fill="#50647A" font-weight="500">順序 2</text><circle cx="246" cy="410" r="27" fill="#7051BC"/><text id="label-7" x="246" y="420" font-size="28" fill="#FFFFFF" font-weight="700" text-anchor="middle">C</text><circle cx="386" cy="410" r="27" fill="#087F8C"/><text id="label-8" x="386" y="420" font-size="28" fill="#FFFFFF" font-weight="700" text-anchor="middle">A</text><circle cx="526" cy="410" r="27" fill="#285EC8"/><text id="label-9" x="526" y="420" font-size="28" fill="#FFFFFF" font-weight="700" text-anchor="middle">B</text><path d="M320 461 L320 493" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="32" y="506" width="576" height="259" rx="20" fill="#FFFFFF" stroke="#D4DEE9" stroke-width="2"/><text id="label-10" x="58" y="553" font-size="28" fill="#182C43" font-weight="700">共有MLP：各点に同じ処理</text><rect x="54" y="582" width="152" height="121" rx="14" fill="#F4F7FB" stroke="#D4DEE9" stroke-width="2"/><text id="label-11" x="130" y="622" font-size="28" fill="#087F8C" font-weight="700" text-anchor="middle">A</text><text id="label-12" x="130" y="673" font-size="28" fill="#182C43" font-weight="600" text-anchor="middle">(1, 4)</text><rect x="244" y="582" width="152" height="121" rx="14" fill="#F4F7FB" stroke="#D4DEE9" stroke-width="2"/><text id="label-13" x="320" y="622" font-size="28" fill="#285EC8" font-weight="700" text-anchor="middle">B</text><text id="label-14" x="320" y="673" font-size="28" fill="#182C43" font-weight="600" text-anchor="middle">(3, 2)</text><rect x="434" y="582" width="152" height="121" rx="14" fill="#F4F7FB" stroke="#D4DEE9" stroke-width="2"/><text id="label-15" x="510" y="622" font-size="28" fill="#7051BC" font-weight="700" text-anchor="middle">C</text><text id="label-16" x="510" y="673" font-size="28" fill="#182C43" font-weight="600" text-anchor="middle">(2, 1)</text><text id="label-17" x="320" y="741" font-size="23" fill="#50647A" font-weight="500" text-anchor="middle">仮の特徴で説明する例</text><path d="M320 772 L320 805" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="32" y="818" width="576" height="214" rx="20" fill="#EBF5F5" stroke="#BAD8DB" stroke-width="2"/><text id="label-18" x="58" y="861" font-size="28" fill="#087F8C" font-weight="700">チャネルごとに max を取る</text><text id="label-19" x="58" y="907" font-size="26" fill="#182C43" font-weight="500">第1：max(1, 3, 2) = 3</text><text id="label-20" x="58" y="947" font-size="26" fill="#182C43" font-weight="500">第2：max(4, 2, 1) = 4</text><text id="label-21" x="320" y="999" font-size="29" fill="#087F8C" font-weight="700" text-anchor="middle">どちらの順序も (3, 4)</text><path d="M320 1032 V1060 H170 V1084" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M320 1060 H470 V1084" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="32" y="1098" width="276" height="246" rx="20" fill="#FFFFFF" stroke="#D4DEE9" stroke-width="2"/><text id="label-22" x="170" y="1144" font-size="28" fill="#087F8C" font-weight="700" text-anchor="middle">分類：不変</text><text id="label-23" x="170" y="1193" font-size="24" fill="#182C43" font-weight="500" text-anchor="middle">全体特徴から</text><text id="label-24" x="170" y="1231" font-size="27" fill="#182C43" font-weight="700" text-anchor="middle">1つの出力</text><text id="label-25" x="170" y="1282" font-size="23" fill="#50647A" font-weight="500" text-anchor="middle">点の順序を変えても</text><text id="label-26" x="170" y="1317" font-size="23" fill="#50647A" font-weight="500" text-anchor="middle">出力は同じ</text><rect x="332" y="1098" width="276" height="246" rx="20" fill="#FFFFFF" stroke="#D4DEE9" stroke-width="2"/><text id="label-27" x="470" y="1144" font-size="28" fill="#285EC8" font-weight="700" text-anchor="middle">分割：同変</text><text id="label-28" x="470" y="1188" font-size="24" fill="#182C43" font-weight="500" text-anchor="middle">点特徴＋全体特徴</text><text id="label-29" x="470" y="1231" font-size="23" fill="#285EC8" font-weight="700" text-anchor="middle">α・β・γ → γ・α・β</text><text id="label-30" x="470" y="1282" font-size="23" fill="#50647A" font-weight="500" text-anchor="middle">点ラベルも入力と</text><text id="label-31" x="470" y="1317" font-size="23" fill="#50647A" font-weight="500" text-anchor="middle">同じ順に移る</text><rect x="32" y="1375" width="576" height="98" rx="16" fill="#FFF7E9" stroke="#EBD6B3" stroke-width="2"/><rect x="32" y="1375" width="7" height="98" rx="3" fill="#9B580D" stroke="#9B580D" stroke-width="0"/><text id="label-32" x="56" y="1409" font-size="24" fill="#9B580D" font-weight="600">特徴・点ラベルは仮の例／未実測</text><text id="label-33" x="56" y="1443" font-size="24" fill="#9B580D" font-weight="600">T-Net などの整列処理は省略</text><path d="M32 1496 L608 1496" fill="none" stroke="#D4DEE9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text id="label-38" x="32" y="1532" font-size="22" fill="#50647A" font-weight="500">独自概念図 · 実測結果ではない</text>
</g>
</svg>
