<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1210" viewBox="0 0 640 1210" role="img" aria-labelledby="title desc" lang="ja">
<title id="title">証明の受理だけで採用を決めない</title>
<desc id="desc">意図した命題の固定、隔離環境での証明全体の検証、公理と信頼の範囲の点検、比較条件の記録を別々の確認段階として並べる。 独自作成の概念図であり、実測結果を示すものではない。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="context-stroke" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g font-family="Noto Sans CJK JP, Noto Sans JP, Hiragino Kaku Gothic ProN, Meiryo, sans-serif">
<rect x="0" y="0" width="640" height="1210" rx="28" fill="#F4F7FB" stroke="#F4F7FB" stroke-width="0"/>
<rect x="32" y="28" width="6" height="25" rx="3" fill="#087F8C" stroke="#087F8C" stroke-width="0"/>
<text x="52" y="49" font-size="22" fill="#087F8C" font-weight="700">FORMAL PROOFS</text>
<text x="32" y="99" font-size="34" fill="#182C43" font-weight="700">証明の受理だけで</text><text x="32" y="142" font-size="34" fill="#182C43" font-weight="700">採用を決めない</text><text x="32" y="184" font-size="23" fill="#50647A" font-weight="500">形式化・検証・信頼・評価を分ける</text><rect x="32" y="212" width="576" height="164" rx="20" fill="#FFFFFF" stroke="#D4DEE9" stroke-width="2"/><rect x="32" y="212" width="7" height="164" rx="3" fill="#087F8C" stroke="#087F8C" stroke-width="0"/><circle cx="73" cy="257" r="22" fill="#087F8C"/><text x="73" y="266" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><text x="110" y="267" font-size="28" fill="#182C43" font-weight="700">命題を固定する</text><text x="58" y="315" font-size="25" fill="#50647A" font-weight="500">型・量化・仮定・結論を照合</text><text x="58" y="350" font-size="25" fill="#50647A" font-weight="500">元の問題を変えていないか</text><rect x="32" y="423" width="576" height="164" rx="20" fill="#FFFFFF" stroke="#D4DEE9" stroke-width="2"/><rect x="32" y="423" width="7" height="164" rx="3" fill="#285EC8" stroke="#285EC8" stroke-width="0"/><circle cx="73" cy="468" r="22" fill="#285EC8"/><text x="73" y="477" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><text x="110" y="478" font-size="28" fill="#182C43" font-weight="700">隔離環境で証明を検証</text><text x="58" y="526" font-size="25" fill="#50647A" font-weight="500">未解決の目標・エラーを確認</text><text x="58" y="561" font-size="25" fill="#50647A" font-weight="500">固定した形式命題に対する受理</text><rect x="32" y="634" width="576" height="190" rx="20" fill="#FFFFFF" stroke="#D4DEE9" stroke-width="2"/><rect x="32" y="634" width="7" height="190" rx="3" fill="#7051BC" stroke="#7051BC" stroke-width="0"/><circle cx="73" cy="679" r="22" fill="#7051BC"/><text x="73" y="688" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><text x="110" y="689" font-size="28" fill="#182C43" font-weight="700">公理・信頼の範囲を点検</text><text x="58" y="737" font-size="25" fill="#50647A" font-weight="500">間接依存と未完成部分を調べる</text><text x="58" y="772" font-size="25" fill="#50647A" font-weight="500">標準公理と追加の信頼を区別</text><text x="58" y="807" font-size="25" fill="#50647A" font-weight="500">使用した検証環境も記録</text><rect x="32" y="871" width="576" height="164" rx="20" fill="#FFFFFF" stroke="#D4DEE9" stroke-width="2"/><rect x="32" y="871" width="7" height="164" rx="3" fill="#087F8C" stroke="#087F8C" stroke-width="0"/><circle cx="73" cy="916" r="22" fill="#087F8C"/><text x="73" y="925" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text><text x="110" y="926" font-size="28" fill="#182C43" font-weight="700">比較条件をそろえる</text><text x="58" y="974" font-size="25" fill="#50647A" font-weight="500">版・試行回数・探索予算を保存</text><text x="58" y="1009" font-size="25" fill="#50647A" font-weight="500">初回成功と修正後の成功を区別</text><path d="M320 383 L320 411" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M320 594 L320 622" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M320 831 L320 859" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="320" y="1082" font-size="25" fill="#087F8C" font-weight="700" text-anchor="middle">各段階で、別の問いを確かめる</text><path d="M32 1126 L608 1126" fill="none" stroke="#D4DEE9" stroke-width="2"/><text x="32" y="1162" font-size="22" fill="#50647A" font-weight="500">独自概念図 · 実測結果ではない</text>
</g>
</svg>
