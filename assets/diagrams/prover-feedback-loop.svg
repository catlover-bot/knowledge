<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1420" viewBox="0 0 640 1420" role="img" aria-labelledby="title desc" lang="ja">
<title id="title">検証済みの部分を次の探索につなげる</title>
<desc id="desc">候補生成、Leanでの検証、有効な接頭部の保持、探索点の選択と再開をループにする。証明完成なら終了し、誤りがあれば最初の誤り以降を破棄する。RMaxTSは末端以外も選択でき、再開時に選んだtactic stateを渡す。学習時のRLPAFの0/1報酬とは別の推論時概念図。 独自作成の概念図であり、実測結果を示すものではない。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="context-stroke" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g font-family="Noto Sans CJK JP, Noto Sans JP, Hiragino Kaku Gothic ProN, Meiryo, sans-serif">
<rect x="0" y="0" width="640" height="1420" rx="28" fill="#F4F7FB" stroke="#F4F7FB" stroke-width="0"/>
<rect x="32" y="28" width="6" height="25" rx="3" fill="#087F8C" stroke="#087F8C" stroke-width="0"/>
<text x="52" y="49" font-size="22" fill="#087F8C" font-weight="700">DEEPSEEK-PROVER-V1.5</text>
<text x="32" y="99" font-size="34" fill="#182C43" font-weight="700">検証済みの部分を</text><text x="32" y="142" font-size="34" fill="#182C43" font-weight="700">次の探索につなげる</text><text x="32" y="184" font-size="23" fill="#50647A" font-weight="500">Lean のフィードバックを使う推論</text><rect x="130" y="212" width="478" height="120" rx="20" fill="#FFFFFF" stroke="#D4DEE9" stroke-width="2"/><circle cx="174" cy="253" r="22" fill="#087F8C"/><text x="174" y="262" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><text x="212" y="263" font-size="29" fill="#182C43" font-weight="700">候補を生成</text><text x="154" y="304" font-size="24" fill="#50647A" font-weight="500">選んだ状態から続きを作る</text><path d="M370 334 L370 369" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="130" y="382" width="478" height="128" rx="20" fill="#FFFFFF" stroke="#D4DEE9" stroke-width="2"/><circle cx="174" cy="426" r="22" fill="#285EC8"/><text x="174" y="435" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><text x="212" y="436" font-size="29" fill="#182C43" font-weight="700">Lean で検証</text><text x="154" y="480" font-size="24" fill="#50647A" font-weight="500">完成・誤り・残る目標を確認</text><path d="M370 510 V541 H137 V570" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M370 541 H437 V570" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="32" y="583" width="210" height="110" rx="20" fill="#E6F4F0" stroke="#ADD0C3" stroke-width="2"/><text x="137" y="649" font-size="29" fill="#087F8C" font-weight="700" text-anchor="middle">証明完成</text><rect x="266" y="583" width="342" height="153" rx="20" fill="#FFF7E9" stroke="#EBD6B3" stroke-width="2"/><text x="437" y="627" font-size="26" fill="#9B580D" font-weight="700" text-anchor="middle">最初の誤り以降</text><text x="437" y="664" font-size="26" fill="#9B580D" font-weight="700" text-anchor="middle">を破棄</text><text x="437" y="708" font-size="23" fill="#50647A" font-weight="500" text-anchor="middle">未完成の候補を整理</text><path d="M437 739 L437 779" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="130" y="792" width="478" height="146" rx="20" fill="#FFFFFF" stroke="#D4DEE9" stroke-width="2"/><circle cx="174" cy="836" r="22" fill="#7051BC"/><text x="174" y="845" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><text x="212" y="846" font-size="27" fill="#182C43" font-weight="700">有効な接頭部を残す</text><text x="154" y="892" font-size="25" fill="#50647A" font-weight="500">確認済みの部分と</text><text x="154" y="925" font-size="25" fill="#50647A" font-weight="500">tactic state を保持</text><path d="M370 941 L370 985" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="130" y="998" width="478" height="173" rx="20" fill="#FFFFFF" stroke="#D4DEE9" stroke-width="2"/><circle cx="174" cy="1042" r="22" fill="#087F8C"/><text x="174" y="1051" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text><text x="212" y="1052" font-size="28" fill="#182C43" font-weight="700">探索点を選び再開</text><text x="154" y="1100" font-size="24" fill="#50647A" font-weight="500">末端以外の探索点も選べる</text><text x="154" y="1140" font-size="24" fill="#50647A" font-weight="500">選んだ tactic state を渡す</text><path d="M130 1084 H15 V274 H118" fill="none" stroke="#087F8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="32" y="1210" width="576" height="98" rx="16" fill="#FFF7E9" stroke="#EBD6B3" stroke-width="2"/><rect x="32" y="1210" width="7" height="98" rx="3" fill="#9B580D" stroke="#9B580D" stroke-width="0"/><text x="56" y="1244" font-size="24" fill="#9B580D" font-weight="600">推論時の探索を表す概念図</text><text x="56" y="1278" font-size="24" fill="#9B580D" font-weight="600">学習時の 0/1 報酬とは区別</text><path d="M32 1336 L608 1336" fill="none" stroke="#D4DEE9" stroke-width="2"/><text x="32" y="1372" font-size="22" fill="#50647A" font-weight="500">独自概念図 · 実測結果ではない</text>
</g>
</svg>
