<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1280" viewBox="0 0 640 1280" role="img" aria-labelledby="title desc" lang="ja">
<title id="title">生成後に何を変えたいかで選ぶ</title>
<desc id="desc">メッシュは表面、パラメトリックな手順は操作と数値、幾何制約は維持したい関係を持つことを、独自の単純形状で対比する。表現は併用でき、製造適合性の保証ではない。 独自作成の概念図であり、実測結果を示すものではない。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="context-stroke" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g font-family="Noto Sans CJK JP, Noto Sans JP, Hiragino Kaku Gothic ProN, Meiryo, sans-serif">
<rect x="0" y="0" width="640" height="1280" rx="28" fill="#F4F7FB" stroke="#F4F7FB" stroke-width="0"/>
<rect x="32" y="28" width="6" height="25" rx="3" fill="#087F8C" stroke="#087F8C" stroke-width="0"/>
<text x="52" y="49" font-size="22" fill="#087F8C" font-weight="700">CAD REPRESENTATIONS</text>
<text x="32" y="99" font-size="34" fill="#182C43" font-weight="700">生成後に何を</text><text x="32" y="142" font-size="34" fill="#182C43" font-weight="700">変えたいかで選ぶ</text><text x="32" y="184" font-size="23" fill="#50647A" font-weight="500">同じ形でも、残せる情報は異なる</text><rect x="32" y="212" width="576" height="244" rx="20" fill="#FFFFFF" stroke="#D4DEE9" stroke-width="2"/><text x="58" y="257" font-size="29" fill="#087F8C" font-weight="700">メッシュ</text><text x="58" y="307" font-size="25" fill="#182C43" font-weight="500">表面の頂点・面を持つ</text><text x="58" y="345" font-size="24" fill="#50647A" font-weight="500">見る・表面を編集する</text><path d="M410 302 L494 278 L560 314 L541 395 L451 417 L399 372 Z" fill="#E3F2F3" stroke="#087F8C" stroke-width="3"/><path d="M410 302 L476 350" fill="none" stroke="#087F8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494 278 L476 350" fill="none" stroke="#087F8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M560 314 L476 350" fill="none" stroke="#087F8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M541 395 L476 350" fill="none" stroke="#087F8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M451 417 L476 350" fill="none" stroke="#087F8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M399 372 L476 350" fill="none" stroke="#087F8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M410 302 L560 314" fill="none" stroke="#087F8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M399 372 L541 395" fill="none" stroke="#087F8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="410" cy="302" r="5" fill="#087F8C"/><circle cx="494" cy="278" r="5" fill="#087F8C"/><circle cx="560" cy="314" r="5" fill="#087F8C"/><circle cx="541" cy="395" r="5" fill="#087F8C"/><circle cx="451" cy="417" r="5" fill="#087F8C"/><circle cx="399" cy="372" r="5" fill="#087F8C"/><circle cx="476" cy="350" r="5" fill="#087F8C"/><text x="58" y="410" font-size="23" fill="#50647A" font-weight="500">例：外観の候補を比べる</text><rect x="32" y="482" width="576" height="266" rx="20" fill="#FFFFFF" stroke="#D4DEE9" stroke-width="2"/><text x="58" y="527" font-size="29" fill="#285EC8" font-weight="700">パラメトリックな手順</text><text x="58" y="579" font-size="25" fill="#182C43" font-weight="500">操作と数値を持つ</text><text x="58" y="617" font-size="24" fill="#50647A" font-weight="500">寸法を変えて再生成</text><path d="M418 608 L537 608 L558 586 L439 586 Z M418 608 L418 676 L537 676 L537 608 M537 608 L558 586 L558 654 L537 676" fill="#E8EEFB" stroke="#285EC8" stroke-width="3" stroke-linejoin="round"/><circle cx="450" cy="641" r="12" fill="#F4F7FB" stroke="#285EC8" stroke-width="3"/><circle cx="505" cy="641" r="12" fill="#F4F7FB" stroke="#285EC8" stroke-width="3"/><text x="58" y="704" font-size="23" fill="#50647A" font-weight="500">例：幅・穴径・押出し量</text><rect x="32" y="774" width="576" height="266" rx="20" fill="#FFFFFF" stroke="#D4DEE9" stroke-width="2"/><text x="58" y="819" font-size="29" fill="#7051BC" font-weight="700">幾何制約</text><text x="58" y="871" font-size="25" fill="#182C43" font-weight="500">保ちたい関係を持つ</text><text x="58" y="909" font-size="24" fill="#50647A" font-weight="500">同径・対称を指定</text><rect x="407" y="866" width="156" height="112" rx="10" fill="#F3EFFA" stroke="#CCBFEB" stroke-width="2"/><path d="M485 850 L485 994" fill="none" stroke="#7051BC" stroke-width="2" stroke-dasharray="7 7"/><circle cx="445" cy="922" r="18" fill="#FFFFFF" stroke="#7051BC" stroke-width="3"/><circle cx="525" cy="922" r="18" fill="#FFFFFF" stroke="#7051BC" stroke-width="3"/><text x="485" y="931" font-size="27" fill="#7051BC" font-weight="700" text-anchor="middle">=</text><text x="58" y="996" font-size="23" fill="#50647A" font-weight="500">例：変更後も左右対称</text><rect x="32" y="1068" width="576" height="98" rx="16" fill="#FFF7E9" stroke="#EBD6B3" stroke-width="2"/><rect x="32" y="1068" width="7" height="98" rx="3" fill="#9B580D" stroke="#9B580D" stroke-width="0"/><text x="56" y="1102" font-size="24" fill="#9B580D" font-weight="600">表現は併用できる</text><text x="56" y="1136" font-size="24" fill="#9B580D" font-weight="600">製造適合性は別に確認する</text><path d="M32 1196 L608 1196" fill="none" stroke="#D4DEE9" stroke-width="2"/><text x="32" y="1232" font-size="22" fill="#50647A" font-weight="500">独自概念図 · 実測結果ではない</text>
</g>
</svg>
