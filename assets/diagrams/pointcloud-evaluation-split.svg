<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1790" viewBox="0 0 640 1790" role="img" aria-labelledby="title desc" lang="ja">
<title id="title">分割を先に決めてテストの情報を隔てる</title>
<desc id="desc">本ノートが提案する評価手順。物体、セッション、被験者などの取得元IDで派生点群を束ね、データ拡張の前にTrain、Val、Testへグループ分割する。架空の取得元Aから得たA1とA2は両方Train、B1とB2はVal、C1とC2はTestに置き、同じ取得元を分割間で混ぜない。学習側だけで正規化統計やモデルをfitし、検証側で設定を選び、固定後にテストする。点順序、幾何的な劣化、未知の対象への汎化は別々に評価する。下部の矢印は作業の順番で、データ混合を表さない。 独自作成の概念図であり、実測結果を示すものではない。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="context-stroke" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g font-family="Noto Sans CJK JP, Noto Sans JP, Hiragino Kaku Gothic ProN, Meiryo, sans-serif">
<rect x="0" y="0" width="640" height="1790" rx="28" fill="#F4F7FB" stroke="#F4F7FB" stroke-width="0"/>
<rect x="32" y="28" width="6" height="25" rx="3" fill="#087F8C" stroke="#087F8C" stroke-width="0"/>
<text id="label-143" x="52" y="49" font-size="22" fill="#087F8C" font-weight="700">POINT CLOUDS · EVALUATION</text>
<text id="label-144" x="32" y="99" font-size="34" fill="#182C43" font-weight="700">分割を先に決めて</text><text id="label-145" x="32" y="142" font-size="34" fill="#182C43" font-weight="700">テストの情報を隔てる</text><text id="label-146" x="32" y="184" font-size="23" fill="#50647A" font-weight="500">本ノートの提案：分割と評価の順序</text><rect x="32" y="212" width="576" height="244" rx="20" fill="#FFFFFF" stroke="#D4DEE9" stroke-width="2"/><text id="label-111" x="58" y="257" font-size="28" fill="#182C43" font-weight="700">取得元IDを先に付ける</text><text id="label-112" x="58" y="297" font-size="25" fill="#50647A" font-weight="500">物体 / セッション / 被験者</text><rect x="56" y="324" width="144" height="102" rx="14" fill="#EBF5F5" stroke="#D4DEE9" stroke-width="2"/><text id="label-113" x="128" y="362" font-size="24" fill="#087F8C" font-weight="700" text-anchor="middle">取得元 A</text><text id="label-114" x="128" y="401" font-size="24" fill="#182C43" font-weight="600" text-anchor="middle">A1・A2</text><rect x="248" y="324" width="144" height="102" rx="14" fill="#EEF1FB" stroke="#D4DEE9" stroke-width="2"/><text id="label-115" x="320" y="362" font-size="24" fill="#285EC8" font-weight="700" text-anchor="middle">取得元 B</text><text id="label-116" x="320" y="401" font-size="24" fill="#182C43" font-weight="600" text-anchor="middle">B1・B2</text><rect x="440" y="324" width="144" height="102" rx="14" fill="#F3EFFA" stroke="#D4DEE9" stroke-width="2"/><text id="label-117" x="512" y="362" font-size="24" fill="#7051BC" font-weight="700" text-anchor="middle">取得元 C</text><text id="label-118" x="512" y="401" font-size="24" fill="#182C43" font-weight="600" text-anchor="middle">C1・C2</text><path d="M320 463 L320 491" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="32" y="505" width="576" height="123" rx="20" fill="#FFF7E9" stroke="#EBD6B3" stroke-width="2"/><text id="label-119" x="320" y="550" font-size="27" fill="#9B580D" font-weight="700" text-anchor="middle">拡張する前に、グループで分割</text><text id="label-120" x="320" y="596" font-size="25" fill="#182C43" font-weight="500" text-anchor="middle">同じ取得元は分割をまたがない</text><path d="M320 628 V651 H128 V675" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M320 634 L320 675" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M320 651 H512 V675" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="40" y="689" width="176" height="116" rx="14" fill="#EBF5F5" stroke="#D4DEE9" stroke-width="2"/><text id="label-121" x="128" y="733" font-size="29" fill="#087F8C" font-weight="700" text-anchor="middle">Train</text><text id="label-122" x="128" y="778" font-size="24" fill="#182C43" font-weight="600" text-anchor="middle">A1・A2</text><rect x="232" y="689" width="176" height="116" rx="14" fill="#EEF1FB" stroke="#D4DEE9" stroke-width="2"/><text id="label-123" x="320" y="733" font-size="29" fill="#285EC8" font-weight="700" text-anchor="middle">Val</text><text id="label-124" x="320" y="778" font-size="24" fill="#182C43" font-weight="600" text-anchor="middle">B1・B2</text><rect x="424" y="689" width="176" height="116" rx="14" fill="#F3EFFA" stroke="#D4DEE9" stroke-width="2"/><text id="label-125" x="512" y="733" font-size="29" fill="#7051BC" font-weight="700" text-anchor="middle">Test</text><text id="label-126" x="512" y="778" font-size="24" fill="#182C43" font-weight="600" text-anchor="middle">C1・C2</text><text id="label-127" x="320" y="847" font-size="23" fill="#50647A" font-weight="500" text-anchor="middle">ここからの矢印は、作業の順番</text><rect x="32" y="876" width="576" height="161" rx="20" fill="#FFFFFF" stroke="#D4DEE9" stroke-width="2"/><circle cx="75" cy="921" r="22" fill="#087F8C"/><text id="label-128" x="75" y="930" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><text id="label-129" x="114" y="931" font-size="28" fill="#087F8C" font-weight="700">Train：学習データで fit</text><text id="label-130" x="58" y="981" font-size="24" fill="#182C43" font-weight="500">正規化統計・特徴選択・モデルを学習</text><text id="label-131" x="58" y="1016" font-size="23" fill="#50647A" font-weight="500">学習用の拡張は、Train内だけで</text><path d="M320 1044 L320 1077" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="32" y="1090" width="576" height="165" rx="20" fill="#FFFFFF" stroke="#D4DEE9" stroke-width="2"/><circle cx="75" cy="1135" r="22" fill="#285EC8"/><text id="label-132" x="75" y="1144" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><text id="label-133" x="114" y="1145" font-size="28" fill="#285EC8" font-weight="700">Val：設定を選び、固定</text><text id="label-134" x="58" y="1195" font-size="24" fill="#182C43" font-weight="500">ハイパーパラメータ・停止時点を選ぶ</text><text id="label-135" x="58" y="1231" font-size="24" fill="#50647A" font-weight="500">テストを見る前に、評価条件も固定</text><path d="M320 1262 L320 1294" fill="none" stroke="#50647A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="32" y="1307" width="576" height="247" rx="20" fill="#FFFFFF" stroke="#D4DEE9" stroke-width="2"/><circle cx="75" cy="1352" r="22" fill="#7051BC"/><text id="label-136" x="75" y="1361" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><text id="label-137" x="114" y="1362" font-size="27" fill="#7051BC" font-weight="700">Test：別の問いを分けて評価</text><circle cx="66" cy="1407" r="5" fill="#7051BC"/><text id="label-138" x="84" y="1415" font-size="25" fill="#182C43" font-weight="500">順序：同じ点の並べ替え</text><circle cx="66" cy="1449" r="5" fill="#7051BC"/><text id="label-139" x="84" y="1457" font-size="25" fill="#182C43" font-weight="500">劣化：ノイズ・欠損・密度</text><circle cx="66" cy="1491" r="5" fill="#7051BC"/><text id="label-140" x="84" y="1499" font-size="25" fill="#182C43" font-weight="500">汎化：未知の物体・取得元</text><rect x="32" y="1585" width="576" height="98" rx="16" fill="#FFF7E9" stroke="#EBD6B3" stroke-width="2"/><rect x="32" y="1585" width="7" height="98" rx="3" fill="#9B580D" stroke="#9B580D" stroke-width="0"/><text id="label-141" x="56" y="1619" font-size="24" fill="#9B580D" font-weight="600">A1・A2 などは架空の派生点群</text><text id="label-142" x="56" y="1653" font-size="24" fill="#9B580D" font-weight="600">同じAからの再標本は、同じ分割内へ</text><path d="M32 1706 L608 1706" fill="none" stroke="#D4DEE9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text id="label-147" x="32" y="1742" font-size="22" fill="#50647A" font-weight="500">独自概念図 · 実測結果ではない</text>
</g>
</svg>
